name: Wisecow CI/CD

on:
  push:
    branches:
      - main
      - feature/containerization

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t vivek65666/wisecow:${{ github.sha }} .
          docker tag vivek65666/wisecow:${{ github.sha }} vivek65666/wisecow:latest

      - name: Push Docker Images
        run: |
          docker push vivek65666/wisecow:${{ github.sha }}
          docker push vivek65666/wisecow:latest